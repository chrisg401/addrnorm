[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "addrnorm"
version = "0.1.0"
description = "Normalize US mailing addresses into a consistent, USPS-style form"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "chrisg401"}]

[project.scripts]
addrnorm = "addrnorm.cli:main"

[tool.setuptools.packages.find]
include = ["addrnorm*"]
